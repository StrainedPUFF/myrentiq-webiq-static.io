<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - myRent-WebIQ</title>
    <!-- Link to the separate CSS file -->
    <link rel="stylesheet" href="css/contactus.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">myRent-WebIQ</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                
                <!-- Dropdown Menu -->
                <li class="dropdown">
                    <a href="#" class="dropbtn">Pages &#9660;</a>
                    <div class="dropdown-content">
                        <!-- <a href="about.html">About Us</a> -->
                        <a href="services.html">Services</a>
                        <a href="contacts.html">Contacts</a>
                    </div>
                </li>

                <li><a href="contactus.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Form Content -->
    <main class="contact-container">
        <section class="contact-card">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you. Please fill out the form below to send us a message.</p>

            <form action="mailto:info@iqmyrent.com" method="POST" enctype="text/plain" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="Name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="Message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

</body>
</html>
